<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Scraping Hub</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: #faf8f3; color: #1c2333; font: 15px "Segoe UI", system-ui, sans-serif;
    }
    h1 { margin: 0; font-weight: 600; font-size: 22px; letter-spacing: .2px; }
    p { margin: 0; color: #5b6475; }
    .bar { width: 220px; height: 3px; border-radius: 3px; background: #e6e1d4; overflow: hidden; }
    .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #b8892d;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <h1>Scraping Hub</h1>
  <div class="bar"></div>
  <p>Starting up&hellip;</p>
</body>
</html>
